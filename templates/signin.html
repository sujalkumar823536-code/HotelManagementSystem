<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: #f5f7fa;
}

.login-section {
  height: 100vh;
}

.left-side {
  background: #f8fbff;
  display: flex;
  align-items: center;
  justify-content: center;
}

.left-side img {
  width: 80%;
}

.right-side {
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-box {
  width: 100%;
  max-width: 400px;
}

.form-control {
  border: none;
  border-bottom: 1px solid #ccc;
  border-radius: 0;
}

.signup-btn {
  background: #1e90ff;
  color: white;
  border: none;
  width: 100%;
  padding: 10px;
  border-radius: 20px;
}

.small-text {
  font-size: 12px;
  color: gray;
}
</style>
</head>

<body>
  <script>
  setTimeout(() => {
    document.querySelectorAll('.alert').forEach(el => el.remove());
  }, 3000);
</script>
<div class="container mt-2">
  {% if messages %}
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }}" role="alert">
    {{message}}
  </div>
  {% endfor %} 
  {% endif %}

</div>


<div class="container-fluid">
  <div class="row login-section">

    <div class="col-md-6 left-side">
      <img src="/static/login.jpg" style="height:100vh; width:100%; object-fit:cover">
    </div>

    <div class="col-md-6 right-side">

      <div class="login-box">
        <form method="POST" action="/signin">
          {% csrf_token %}

          <h2>SIGN UP</h2>
          <p class="small-text">Create your account</p>

          <table class="table table-borderless">

            <tr>
              <td><input type="text" name="username" class="form-control" placeholder="Username"></td>
            </tr>

            <tr>
              <td><input type="email" name="email" class="form-control" placeholder="Email"></td>
            </tr>

            <tr>
              <td><input type="password" name="password1" class="form-control" placeholder="Password"></td>
            </tr>

            <tr>
              <td><input type="password" name="password2" class="form-control" placeholder="Confirm Password"></td>
            </tr>

          </table>

          <button type="submit" class="signup-btn mt-3">
              SIGN UP
          </button>

          <div class="text-center mt-3 small-text">
            Already have an account?
            <a href="/login">Login</a>
          </div>

        </form>
      </div>

    </div>

  </div>
</div>

</body>
</html>
