<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Page</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
  background: #f5f7fa;
}

.container-box {
  max-width: 500px;
  margin: 50px auto;
  padding: 25px;
  border-radius: 15px;
  background: #fff;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.total {
  font-size: 26px;
  font-weight: bold;
  color: green;
}

.label {
  font-weight: 500;
}

.btn-success {
  background-color: #0b7a0b;
  border: none;
  border-radius: 8px;
  font-weight: 500;
}

.btn-success:hover {
  background-color: #095c09;
}
</style>
</head>

<body>

<div class="container-box">

  <h4 class="mb-4">Payment Summary</h4>

  <p><span class="label">Hotel:</span> {{ hotel }}</p>
  <p><span class="label">Location:</span> {{ location }}</p>

  <p><span class="label">Check-in:</span> {{ checkin }}</p>
  <p><span class="label">Check-out:</span> {{ checkout }}</p>

  <hr>

  <p><span class="label">Price per night:</span> ₹ {{ price }}</p>
  <p><span class="label">Total Nights:</span> {{ days }}</p>

  <hr>

  <p class="total">Total Amount: ₹ {{ total }}</p>

  <form id="paymentForm">
    {% csrf_token %}

    <input type="hidden" name="location" value="{{ location }}">
    <input type="hidden" name="hotel" value="{{ hotel }}">
    <input type="hidden" name="total" value="{{ total }}">

    <button type="submit" class="btn btn-primary w-100 mt-3">
      Pay Now
    </button>
  </form>

  <div id="successBox" style="display:none; text-align:center; margin-top:20px;">
    <h2 style="color:green;">✔ Payment Successful</h2>
    <p>Your room has been booked!</p>

    
    <div class="d-flex justify-content-end mt-3">
      <a href="/" class="btn btn-success px-4 py-2">
        <i class="bi bi-house-fill"></i> Go to Home Page
      </a>
    </div>
  </div>

</div>

<script>
document.getElementById("paymentForm").addEventListener("submit", function(e){
    e.preventDefault(); 

    fetch("/confirm_booking", {
        method: "POST",
        headers: {
            "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value,
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams(new FormData(this))
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === "success") {
            document.getElementById("paymentForm").style.display = "none";
            document.getElementById("successBox").style.display = "block";
        }
    });
});
</script>

</body>
</html>
