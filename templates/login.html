<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: #f5f7fa;
}

/* Full height */
.login-section {
  height: 100vh;
}

/* Left side */
.left-side {
  background: #f8fbff;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Image */
.left-side img {
  width: 80%;
}

/* Right side */
.right-side {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Form box */
.login-box {
  width: 100%;
  max-width: 350px;
}

/* Heading */
.login-box h2 {
  font-weight: bold;
}

/* Inputs */
.form-control {
  border: none;
  border-bottom: 1px solid #ccc;
  border-radius: 0;
}

/* Button */
.login-btn {
  background: #1e90ff;
  color: white;
  border: none;
  width: 100%;
  padding: 10px;
  border-radius: 20px;
}
.signin-btn {
  background: #1e90ff;
  color: white;
  border: none;
  width: 100%;
  padding: 10px;
  border-radius: 20px;
}

/* Small text */
.small-text {
  font-size: 12px;
  color: gray;
}

</style>


</head>

<body>
<script>
  setTimeout(() => {
    document.querySelectorAll('.alert').forEach(el => el.remove());
  }, 3000);
</script>
<div class="container mt-2">
  {% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }} text-center">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}
</div>

<div class="container-fluid">
  <div class="row login-section">

    <div class="col-md-6 left-side" >
      <img src="/static/login.jpg" style="height:100vh; width:100%; object-fit:cover" >
    </div>

    <div class="col-md-6 right-side">

      <div class="login-box">
      <form method="POST" action="/login">
        {% csrf_token %}
        <h2>LOGIN</h2>
        <p class="small-text">Welcome back!</p>

        <div class="mb-3">
          <input type="text" name="username" class="form-control" placeholder="Username">
        </div>

        <div class="mb-3">
          <input type="password" name="password"  class="form-control" placeholder="Password">
        </div>


       <div class="text-center mt-3">

    <button type="submit" class="btn btn-dark w-100 mb-2">
        LOGIN
    </button>

    <p>or</p>

    <a href="/signin" class="btn btn-outline-dark w-100">
        SIGN IN
    </a>

</div>

        <div class="d-flex justify-content-between mt-3 small-text">
          <a href="/"><span>Back</span></a>
          
        </div>
      </form>
      </div>

    </div>

  </div>
</div>

</body>
</html>
