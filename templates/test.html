<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Booking UI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body {
  background: #f5f7fa;
  overflow-x: hidden;
}

/* HERO */
.hero {
  position: relative;
  height: 260px;
  background: url('/static/couple.jpg') center/cover no-repeat;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  border-radius: 20px;
}

.hero-content {
  position: relative;
  z-index: 2;
}

/* SEARCH BOX */
.search-box {
  background: white;
  border-radius: 50px;
  padding: 10px 15px;
  max-width: 900px;
  margin: auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  transform: translateY(-30px);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.search-box input {
  border: none;
  outline: none;
  font-size: 14px;
}

/* DESTINATIONS */
.destination-card {
  border-radius: 18px;
  overflow: hidden;
  height: 100%;
  position: relative;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

/* IMAGE STYLE (✨ MAIN CHANGE) */
.destination-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;

  filter: brightness(0.85) saturate(1.1);
  transition: 0.4s ease;
}

/* Soft overlay like booking UI */
.destination-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.15);
}

/* Hover effect */
.destination-card:hover img {
  filter: brightness(1) saturate(1.2);
  transform: scale(1.05);
}

/* Sizes */
.tall {
  min-height: 170px;
}

.big {
  height: 100px;
}

.small {
  height: 50px;
}

/* Label (improved) */
.label {
  position: absolute;
  bottom: 10px;
  left: 10px;
  background: rgba(255,255,255,0.95);
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.container {
  max-width: 1100px;
}

</style>
</head>

<body>
<script>
  setTimeout(() => {
    document.querySelectorAll('.alert').forEach(el => el.remove());
  }, 3000);
</script>
<div class="container mt-2">
  {% if messages %}
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }}" role="alert">
    {{message}}
  </div>
  {% endfor %} 
  {% endif %}

</div>

<div class="container py-3">

  <div class="hero">
    <div class="hero-content">
      <h3>Book your stay with Lucia</h3>
      <p class="mb-0">1,480,086 rooms around the world are waiting for you!</p>
    </div>
  </div>

  <form action="/test" method="POST">
    {% csrf_token %}
  <div class="search-box">

   <div>
  <small>Location</small><br>

  <select class="form-control" name="location" required>
    <option value="">Select Location</option>


    <option>Andhra Pradesh</option>
    <option>Arunachal Pradesh</option>
    <option>Assam</option>
    <option>Bihar</option>
    <option>Chhattisgarh</option>
    <option>Goa</option>
    <option>Gujarat</option>
    <option>Haryana</option>
    <option>Himachal Pradesh</option>
    <option>Jharkhand</option>
    <option>Karnataka</option>
    <option>Kerala</option>
    <option>Madhya Pradesh</option>
    <option>Maharashtra</option>
    <option>Manipur</option>
    <option>Meghalaya</option>
    <option>Mizoram</option>
    <option>Nagaland</option>
    <option>Odisha</option>
    <option>Punjab</option>
    <option>Rajasthan</option>
    <option>Sikkim</option>
    <option>Tamil Nadu</option>
    <option>Telangana</option>
    <option>Tripura</option>
    <option>Uttar Pradesh</option>
    <option>Uttarakhand</option>
    <option>West Bengal</option>

    <option>Andaman and Nicobar Islands</option>
    <option>Chandigarh</option>
    <option>Dadra and Nagar Haveli and Daman and Diu</option>
    <option>Delhi</option>
    <option>Jammu and Kashmir</option>
    <option>Ladakh</option>
    <option>Lakshadweep</option>
    <option>Puducherry</option>

  </select>
</div>

    <div>
      <small>Check-in</small><br>
      <input type="date" class="form-control" name="checkin">
    </div>

    <div>
      <small>Check-out</small><br>
      <input type="date"  class="form-control" name="checkout">
    </div>

    <div>
      <small>Guests</small><br>
      <input type="number" class="form-control" name="guest" placeholder="Guests">
    </div>

    <a href="/booking"><button  class="btn btn-primary rounded-circle px-3"> → </button></a>

  </div>
  </form>

  <h6 class="mt-1 mb-2">Popular destinations</h6>

  <div class="row g-3 mt-1 align-items-stretch">

    <div class="col-md-3 d-flex">
      <div class="destination-card tall w-100">
        <img src="/static/goa.jpg">
        <div class="label">Goa</div>
      </div>
    </div>

    <div class="col-md-3 d-flex flex-column">
      <div class="destination-card mb-2">
        <img src="/static/odisha.jpg" class="big">
        <div class="label">Odisha</div>
      </div>

      <div class="destination-card">
        <img src="/static/up.jpg" class="small">
        <div class="label">Uttar Pradesh</div>
      </div>
    </div>

    <div class="col-md-3 d-flex">
      <div class="destination-card tall w-100">
        <img src="/static/kashmir.jpg">
        <div class="label">Kashmir</div>
      </div>
    </div>

    <div class="col-md-3 d-flex flex-column">
      <div class="destination-card mb-2">
        <img src="/static/rajasthan.jpg" class="small">
        <div class="label">Rajasthan</div>
      </div>

      <div class="destination-card">
        <img src="/static/kerala.jpg" class="small">
        <div class="label">Kerala</div>
      </div>
    </div>

  </div>

</div>

</body>
</html>
